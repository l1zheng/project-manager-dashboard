name: Windows release

on:
  workflow_dispatch:
    inputs:
      application_version:
        description: 'Version written into the Windows artifacts'
        required: false
        default: '0.1.0'
      release_tag:
        description: 'Optional unique Git tag for the private GitHub Release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish Windows x64 installer and ZIP
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NODE_VERSION: 24.19.0
      PNPM_VERSION: 11.9.0
      APPLICATION_VERSION: ${{ inputs.application_version || '0.1.0' }}
      RELEASE_TAG: ${{ inputs.release_tag || '' }}
      WINDOWS_SIGNTOOL_COMMAND: ${{ secrets.WINDOWS_SIGNTOOL_COMMAND }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Build and verify portable release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((node --version) -ne "v$env:NODE_VERSION") {
            throw "Unexpected Node.js version: $(node --version)"
          }
          if ((pnpm --version) -ne $env:PNPM_VERSION) {
            throw "Unexpected pnpm version: $(pnpm --version)"
          }
          & .\release\build-windows-portable.ps1 `
            -Architecture x64 `
            -ApplicationVersion $env:APPLICATION_VERSION

      - name: Run full journey against extracted portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\release\verify-windows-portable.ps1 `
            -ArchivePath ".\artifacts\ProjectManagerDashboard-$env:APPLICATION_VERSION-win-x64.zip" `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'project-manager-portable-acceptance')

      - name: Install verified Inno Setup compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = & .\release\install-inno-setup.ps1 `
            -InstallDirectory (Join-Path $env:RUNNER_TEMP 'inno-setup')
          "INNO_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and verify per-user installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installerParameters = @{
            ReleaseDirectory = ".\artifacts\ProjectManagerDashboard-$env:APPLICATION_VERSION-win-x64"
            Architecture = 'x64'
            ApplicationVersion = $env:APPLICATION_VERSION
            InnoCompiler = $env:INNO_COMPILER
          }
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNTOOL_COMMAND)) {
            $installerParameters.SignToolCommand = $env:WINDOWS_SIGNTOOL_COMMAND
          }
          & .\release\build-windows-installer.ps1 @installerParameters
          & .\release\verify-windows-installer.ps1 `
            -InstallerPath ".\artifacts\ProjectManagerDashboard-Setup-$env:APPLICATION_VERSION-win-x64.exe" `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'project-manager-installer-acceptance')

      - name: Publish private GitHub Release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "windows-build-$($env:APPLICATION_VERSION)-$($env:GITHUB_RUN_NUMBER)"
          }
          if ($tag -notmatch '^[0-9A-Za-z._/-]{1,100}$') {
            throw "Release tag contains unsupported characters: $tag"
          }
          $archive = Get-Item -LiteralPath ".\artifacts\ProjectManagerDashboard-$env:APPLICATION_VERSION-win-x64.zip"
          $installer = Get-Item -LiteralPath ".\artifacts\ProjectManagerDashboard-Setup-$env:APPLICATION_VERSION-win-x64.exe"
          $signingNote = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNTOOL_COMMAND)) {
            'The installer is unsigned until a trusted code-signing certificate is configured.'
          } else {
            'The installer and native launcher passed Authenticode signature validation during the build.'
          }
          gh release create $tag $installer.FullName $archive.FullName `
            --target $env:GITHUB_SHA `
            --title "Project Manager Dashboard $($env:APPLICATION_VERSION) Windows x64" `
            --notes "Windows x64 per-user installer and portable build from commit $($env:GITHUB_SHA). $signingNote" `
            --prerelease
